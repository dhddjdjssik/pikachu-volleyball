name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web game
        run: |
          npm ci
          npm run build

      - name: Fix start page
        run: |
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8" />
          <script>location.replace('en/index.html');</script>
          EOF

      - name: Add Capacitor and Android project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.example.pikachuvolleyball",
            "appName": "Pikachu Volleyball",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android
          sed -i 's|<activity|<activity android:screenOrientation="landscape"|' android/app/src/main/AndroidManifest.xml

      - name: Fix duplicate Kotlin libraries
        run: |
          echo 'dependencies { implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")) }' >> android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pikachu-volleyball-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
